services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tenderhawk
      POSTGRES_PASSWORD: tenderhawk
      POSTGRES_DB: tenderhawk
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderhawk -d tenderhawk"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
