# `docker compose up -d`                 -> Postgres + pgvector and Redis (run the API and web locally)
# `docker compose --profile app up -d`   -> also the API (:8000) and the dashboard (:3000)
# Host ports can be moved if something already uses them, e.g. REDIS_PORT=6380.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tenderhawk
      POSTGRES_PASSWORD: tenderhawk
      POSTGRES_DB: tenderhawk
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderhawk -d tenderhawk"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
  api:
    profiles: [app]
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://tenderhawk:tenderhawk@db:5432/tenderhawk
      REDIS_URL: redis://redis:6379/0
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 30
  web:
    profiles: [app]
    build:
      context: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  pgdata:
